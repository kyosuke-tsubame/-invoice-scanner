<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>納品書アップロード</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="納品書アップロード">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  background: #f0ede8;
  min-height: 100vh;
  color: #1a1a1a;
}
header {
  background: #1c2340;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 { color: #fff; font-size: 16px; font-weight: 600; }
.container { max-width: 640px; margin: 0 auto; padding: 20px 16px 100px; }

.card {
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid #e4e0da;
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  color: #999;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.btn {
  padding: 11px 20px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-dark { background: #1c2340; color: #fff; }
.btn-green { background: #1d9e75; color: #fff; }
.btn-outline { background: #fff; color: #1c2340; border: 1.5px solid #1c2340; }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-full { width: 100%; padding: 14px; font-size: 15px; }

.signin-box { text-align: center; padding: 12px 4px; }
.signin-icon { font-size: 40px; margin-bottom: 10px; }
.signin-text { font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.6; }
.account-label {
  font-size: 12px; color: #1d9e75; font-weight: 600;
  text-align: center; margin-bottom: 4px;
}
.signout-link {
  display: block; text-align: center; font-size: 11px; color: #aaa;
  margin-top: 8px; cursor: pointer; text-decoration: underline;
}

.drop-area {
  border: 2px dashed #ccc;
  border-radius: 14px;
  padding: 32px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  background: #fafafa;
}
.drop-area:hover, .drop-area.drag {
  background: #eef2ff;
  border-color: #3b6fd4;
}
.drop-icon { font-size: 40px; margin-bottom: 10px; }
.drop-text { font-size: 13px; color: #888; margin-bottom: 14px; line-height: 1.6; }

.preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
  margin-top: 14px;
}
.preview-card {
  border-radius: 10px;
  overflow: hidden;
  border: 1.5px solid #e4e0da;
  position: relative;
  background: #fff;
}
.preview-card img { width: 100%; height: 80px; object-fit: cover; display: block; }
.preview-name {
  font-size: 10px; color: #888; padding: 4px 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.badge {
  position: absolute; top: 4px; right: 4px;
  font-size: 9px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px;
}
.badge-wait { background: #f1f5f9; color: #64748b; }
.badge-loading { background: #dbeafe; color: #1e40af; }
.badge-done { background: #dcfce7; color: #166534; }
.badge-error { background: #fee2e2; color: #991b1b; }
.remove-btn {
  position: absolute; top: 4px; left: 4px;
  background: rgba(0,0,0,0.5); border: none;
  border-radius: 50%; width: 20px; height: 20px;
  color: #fff; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}

.progress-wrap { margin: 12px 0 4px; }
.progress-bar { height: 4px; background: #e4e0da; border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: #3b6fd4; transition: width 0.3s ease; border-radius: 4px; }
.progress-label { font-size: 11px; color: #888; margin-top: 4px; text-align: right; }

.actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

.error-row {
  padding: 12px 16px; background: #fff5f5; border-radius: 10px;
  font-size: 13px; color: #991b1b; margin-bottom: 10px;
  border: 1px solid #fecaca;
}
.done-box {
  text-align: center; padding: 24px 4px;
}
.done-icon { font-size: 40px; margin-bottom: 10px; }
.done-text { font-size: 14px; color: #1d9e75; font-weight: 600; }

.store-row { margin-bottom: 14px; }
.store-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.store-select {
  width: 100%; padding: 12px; font-size: 15px; font-family: inherit;
  border: 1.5px solid #1c2340; border-radius: 10px; background: #fff; color: #1a1a1a;
}
.store-note { font-size: 11px; color: #888; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <span style="font-size:22px">📮</span>
  <h1>納品書アップロード</h1>
</header>

<div class="container">

  <!-- サインイン -->
  <div class="card" id="signinCard">
    <div class="signin-box">
      <div class="signin-icon">🔐</div>
      <p class="signin-text">写真を送るには、最初に一度だけ<br>サインインしてください</p>
      <button class="btn btn-dark" id="signinBtn" onclick="signIn()">Microsoftアカウントでサインイン</button>
    </div>
  </div>

  <!-- アップロード（サインイン後に表示） -->
  <div class="card" id="uploadCard" style="display:none">
    <div class="account-label" id="accountLabel"></div>
    <div class="card-title">納品書・レシートをアップロード</div>
    <div class="store-row">
      <label class="store-label" for="storeSelect">どの店の分ですか？</label>
      <select class="store-select" id="storeSelect" onchange="saveStore(this.value)">
        <option value="">選ばない（AIが写真から判断）</option>
      </select>
      <p class="store-note">一度選ぶと、このスマホでは次から自動でこの店になります。<br>レシートは店名が書いていないので、必ず店を選んでください。</p>
    </div>
    <div class="drop-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <div class="drop-icon">📷</div>
      <p class="drop-text">納品書・レシートの写真をここにドロップ<br>またはタップして選択</p>
      <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">
        写真を選択
      </button>
      <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="addFiles(this.files)">
    </div>

    <div class="preview-grid" id="previewGrid"></div>

    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>

    <div class="actions" id="actionsArea" style="display:none">
      <button class="btn btn-green btn-full" id="sendBtn" onclick="sendAll()">送信する</button>
    </div>

    <div id="errorArea"></div>
    <div id="doneArea"></div>

    <div class="signout-link" onclick="signOut()">別のアカウントでサインインし直す</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script>
// ── 設定 ──────────────────────────────────
const FOLDER_ITEM_ID = 'E017E7B2128EB245!sf8c49dc880e6429885bc31cfb295eeca'; // 受信箱フォルダ
const GRAPH_SCOPES = ['Files.ReadWrite'];
// 「納品書写真/」直下の店舗フォルダ名。夜の読み取り（automation/run_invoice_ocr.sh の STORES）と同じ名前にすること
const STORES = ['本店', 'KADODE店', '空港店', '静岡紺屋町店', 'セントラル', '冷凍事業部', '製麺事業部'];
const STORE_KEY = 'invoiceUploadStore';

const msalConfig = {
  auth: {
    clientId: '534bb9d0-a31c-4cd9-9486-7fe29205785a',
    authority: 'https://login.microsoftonline.com/consumers',
    redirectUri: 'https://kyosuke-tsubame.github.io/-invoice-scanner/upload.html'
  },
  cache: {
    cacheLocation: 'localStorage'
  }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);

let account = null;
let files = [];
let fileStatus = {}; // idx -> 'wait' | 'loading' | 'done' | 'error'

// ── サインイン ────────────────────────────
// スマホ（特にiPhone）では別窓（ポップアップ）方式のサインイン確認が
// ブロックされて失敗しやすいため、画面遷移（リダイレクト）方式を使う。
async function initAuth() {
  await msalInstance.initialize();
  try {
    const redirectResult = await msalInstance.handleRedirectPromise();
    if (redirectResult && redirectResult.account) {
      account = redirectResult.account;
    }
  } catch (e) {
    // サインインし直しからの戻りで失敗した場合は、通常のサインイン画面を出す
  }
  if (!account) {
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      account = accounts[0];
    }
  }
  if (account) {
    showSignedIn();
  }
}

async function signIn() {
  const btn = document.getElementById('signinBtn');
  btn.disabled = true;
  btn.textContent = 'サインイン中...';
  try {
    await msalInstance.loginRedirect({ scopes: GRAPH_SCOPES });
    // loginRedirectは画面遷移するため、ここには到達しない
  } catch (e) {
    alert('サインインに失敗しました。もう一度お試しください。');
    btn.disabled = false;
    btn.textContent = 'Microsoftアカウントでサインイン';
  }
}

function signOut() {
  files = [];
  fileStatus = {};
  msalInstance.logoutRedirect({ account });
}

function showSignedIn() {
  document.getElementById('signinCard').style.display = 'none';
  document.getElementById('uploadCard').style.display = '';
  document.getElementById('accountLabel').textContent = '✓ ' + (account.username || 'サインイン済み');
}

async function getAccessToken() {
  const request = { scopes: GRAPH_SCOPES, account };
  for (let n = 1; n <= 2; n++) {
    try {
      const result = await msalInstance.acquireTokenSilent(request);
      return result.accessToken;
    } catch (e) {
      // 本当にサインインし直しが必要なときだけ、画面遷移（リダイレクト）でサインインし直す。
      // 別窓（ポップアップ）方式はスマホでブロックされやすいため使わない。遷移するのでここには戻ってこない。
      if (e instanceof msal.InteractionRequiredAuthError) {
        await msalInstance.acquireTokenRedirect(request);
        return null;
      }
      // 通信の一時的な失敗なら、少し待って1回だけやり直す（立ち上げ直後の1回目の失敗対策）
      if (n === 2) throw e;
      await sleep(1000);
    }
  }
}

// ── 店の選択（このスマホに覚えておく） ──────
function initStoreSelect() {
  const sel = document.getElementById('storeSelect');
  STORES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
  let saved = '';
  try { saved = localStorage.getItem(STORE_KEY) || ''; } catch (e) {}
  if (STORES.includes(saved)) sel.value = saved;
}

function saveStore(value) {
  try { localStorage.setItem(STORE_KEY, value); } catch (e) {}
}

// ── ファイル操作 ──────────────────────────
function addFiles(newFiles) {
  Array.from(newFiles).forEach(f => {
    if (!f.type.startsWith('image/')) return;
    if (files.find(x => x.name === f.name && x.size === f.size)) return;
    files.push(f);
  });
  document.getElementById('fileInput').value = '';
  document.getElementById('doneArea').innerHTML = '';
  renderPreviews();
  updateActions();
}

function removeFile(idx) {
  files.splice(idx, 1);
  const newS = {};
  Object.keys(fileStatus).forEach(k => {
    const ki = parseInt(k);
    if (ki < idx) newS[ki] = fileStatus[k];
    else if (ki > idx) newS[ki - 1] = fileStatus[k];
  });
  fileStatus = newS;
  renderPreviews();
  updateActions();
}

function updateActions() {
  document.getElementById('actionsArea').style.display = files.length ? '' : 'none';
}

function renderPreviews() {
  const grid = document.getElementById('previewGrid');
  grid.innerHTML = '';
  files.forEach((f, i) => {
    const status = fileStatus[i];
    const url = URL.createObjectURL(f);
    const badgeMap = { loading: 'badge-loading', done: 'badge-done', error: 'badge-error' };
    const labelMap = { loading: '送信中', done: '完了', error: 'エラー' };
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.innerHTML = `
      <img src="${url}" alt="${esc(f.name)}">
      <div class="preview-name">${esc(f.name)}</div>
      ${status ? `<div class="badge ${badgeMap[status] || 'badge-wait'}">${labelMap[status] || ''}</div>` : ''}
      ${status !== 'done' ? `<button class="remove-btn" onclick="removeFile(${i})" title="削除">×</button>` : ''}
    `;
    grid.appendChild(card);
  });
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── ファイル名の重複対策 ──────────────────
function pad(n) { return String(n).padStart(2, '0'); }

function generateUniqueFilename(originalName) {
  const m = originalName.match(/\.[^.]+$/);
  const ext = m ? m[0] : '';
  const base = m ? originalName.slice(0, -ext.length) : originalName;
  const now = new Date();
  const ts = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const rand = Math.random().toString(36).slice(2, 8);
  return `${ts}_${rand}_${base}${ext}`;
}

// ── 通信のやり直し ────────────────────────
// iPhoneでは、ページを開き直した直後の1回目の通信が「通信が切れました」で失敗することがある
// （裏に置いていた間に切れた古い通信の道を使い回すため）。2回目以降は成功するので、
// 通信そのものの失敗と、サーバー側の一時的な不調（429・5xx）だけ、少し待って最大3回までやり直す。
// 2026-09-25追加：「立ち上げの1回目がだいたい失敗する」という報告への対応。
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchWithRetry(url, options, tries = 3) {
  let lastError;
  for (let n = 1; n <= tries; n++) {
    try {
      const res = await fetch(url, options);
      if (res.status !== 429 && res.status < 500) return res;
      lastError = new Error(`サーバー応答 ${res.status}`);
    } catch (e) {
      lastError = e; // 通信そのものの失敗（Load failed など）
    }
    if (n < tries) await sleep(800 * n);
  }
  throw lastError;
}

// ── OneDriveへ送信 ────────────────────────
// 店を選んだときは受信箱と同じ階層（納品書写真/）の店舗フォルダへ直接入れる。
// 受信箱を通らないので夜のAI仕分けを経ずにその店として読み取られる（レシートのように店名が無い写真のため）
let photosRoot = null; // { driveId, id }：受信箱の親＝「納品書写真」フォルダ
async function getPhotosRoot(accessToken) {
  if (photosRoot) return photosRoot;
  const res = await fetchWithRetry(`https://graph.microsoft.com/v1.0/me/drive/items/${FOLDER_ITEM_ID}?$select=parentReference`, {
    headers: { 'Authorization': `Bearer ${accessToken}` }
  });
  if (!res.ok) throw new Error('店のフォルダが見つかりません');
  const ref = (await res.json()).parentReference;
  if (!ref || !ref.driveId || !ref.id) throw new Error('店のフォルダが見つかりません');
  photosRoot = { driveId: ref.driveId, id: ref.id };
  return photosRoot;
}

async function uploadUrlFor(filename, store, accessToken) {
  const name = encodeURIComponent(filename);
  if (!store) {
    return `https://graph.microsoft.com/v1.0/me/drive/items/${FOLDER_ITEM_ID}:/${name}:/createUploadSession`;
  }
  const root = await getPhotosRoot(accessToken);
  return `https://graph.microsoft.com/v1.0/drives/${root.driveId}/items/${root.id}:/${encodeURIComponent(store)}/${name}:/createUploadSession`;
}

// 店のフォルダへ入れられなかったときは受信箱へ入れ直す（写真を失くさないため。店は夜のAIが判断する）。
// 入れた先の店名を返す（受信箱なら空）
async function uploadWithStore(file, filename, store, accessToken) {
  if (store) {
    try {
      await uploadFileToOneDrive(file, await uploadUrlFor(filename, store, accessToken), accessToken);
      return store;
    } catch (e) {
      console.warn('店のフォルダへの送信に失敗したため受信箱へ送ります', e);
    }
  }
  await uploadFileToOneDrive(file, await uploadUrlFor(filename, '', accessToken), accessToken);
  return '';
}

async function uploadFileToOneDrive(file, createUrl, accessToken) {
  const sessionRes = await fetchWithRetry(createUrl, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'rename' } })
  });
  if (!sessionRes.ok) throw new Error(`送信の準備に失敗しました（${sessionRes.status}）`);
  const session = await sessionRes.json();
  const uploadUrl = session.uploadUrl;

  const chunkSize = 3932160; // Graph APIの仕様（327,680の倍数）に合わせたチャンクサイズ
  const total = file.size;
  let start = 0;

  while (start < total) {
    const end = Math.min(start + chunkSize, total);
    const chunk = file.slice(start, end);
    const res = await fetchWithRetry(uploadUrl, {
      method: 'PUT',
      headers: {
        'Content-Length': String(end - start),
        'Content-Range': `bytes ${start}-${end - 1}/${total}`
      },
      body: chunk
    });
    if (!res.ok && res.status !== 202) {
      throw new Error(`写真の送信に失敗しました（${res.status}）`);
    }
    start = end;
  }
}

async function sendAll() {
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  document.getElementById('progressWrap').style.display = '';
  document.getElementById('errorArea').innerHTML = '';

  let accessToken;
  try {
    accessToken = await getAccessToken();
  } catch (e) {
    document.getElementById('errorArea').innerHTML =
      `<div class="error-row">⚠ サインインの確認に失敗しました。電波の良い場所でもう一度お試しください。${reasonText(e)}</div>`;
    btn.disabled = false;
    return;
  }
  if (!accessToken) {
    // サインインし直しの画面へ遷移中（通常はページがここで離脱する）
    return;
  }

  const store = document.getElementById('storeSelect').value;
  let done = 0;
  const toSend = files.map((f, i) => i).filter(i => fileStatus[i] !== 'done');
  let hasError = false;
  let lastError = null;
  let toInbox = 0; // 店を選んだのに店のフォルダへ入れられず受信箱へ回した枚数

  for (const i of toSend) {
    fileStatus[i] = 'loading';
    renderPreviews();
    try {
      const filename = generateUniqueFilename(files[i].name);
      if (await uploadWithStore(files[i], filename, store, accessToken) !== store) toInbox++;
      fileStatus[i] = 'done';
    } catch (e) {
      fileStatus[i] = 'error';
      hasError = true;
      lastError = e;
    }
    done++;
    const pct = Math.round((done / toSend.length) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${done} / ${toSend.length}`;
    renderPreviews();
  }

  btn.disabled = false;

  if (hasError) {
    document.getElementById('errorArea').innerHTML =
      `<div class="error-row">⚠ 一部の写真の送信に失敗しました。電波の良い場所でもう一度お試しください（成功した写真はそのまま残ります）。${reasonText(lastError)}</div>`;
  } else {
    document.getElementById('doneArea').innerHTML = `
      <div class="done-box">
        <div class="done-icon">✅</div>
        <div class="done-text">送信が完了しました！${store ? `（${esc(store)}）` : ''}</div>
        ${store && toInbox ? `<p class="store-note">うち${toInbox}枚は店のフォルダに入れられなかったため、受信箱に送りました（店は夜にAIが判断します）</p>` : ''}
      </div>`;
    files = [];
    fileStatus = {};
    document.getElementById('previewGrid').innerHTML = '';
    document.getElementById('progressWrap').style.display = 'none';
    updateActions();
  }
}

// 失敗の理由を小さく添える（続くときに原因を突き止めるため）
function reasonText(e) {
  if (!e) return '';
  return `<div style="font-size:11px;opacity:.75;margin-top:4px">理由：${esc(e.errorCode || e.message || String(e))}</div>`;
}

// ── ドラッグ&ドロップ ─────────────────────
const dropArea = document.getElementById('dropArea');
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('drag'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('drag'));
dropArea.addEventListener('drop', e => {
  e.preventDefault();
  dropArea.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
